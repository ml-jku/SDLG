name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: >-
          python -m pip install
          --index-url https://download.pytorch.org/whl/cpu
          torch==2.4.0
      - run: >-
          python -m pip install
          accelerate==0.33.0
          datasets==2.19.1
          evaluate==0.4.0
          numpy==1.26.4
          pandas==2.2.2
          pyarrow==16.1.0
          pytest==8.3.5
          PyYAML==6.0.1
          ruff==0.9.10
          tqdm==4.66.4
          transformers==4.46.2
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest
